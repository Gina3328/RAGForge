[project]
name = "ragforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gina3328", email = "fengxiao3328@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "langchain-anthropic>=1.7.1",
    "langchain-community>=0.4.2",
    "pymilvus>=3.0.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ragas<0.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
ragforge = "ragforge:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
